[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intrallm-sandbox"
version = "0.1.0"
description = "Enterprise sandbox control plane and dashboard for the IntraLLM agent"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "docker>=7.0",
    "psutil>=5.9",
    "httpx>=0.27",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
intrallm-sandbox = "intrallm_sandbox.__main__:main"

[tool.setuptools.packages.find]
include = ["intrallm_sandbox*"]

[tool.setuptools.package-data]
intrallm_sandbox = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
